<div class="tutorial-widget">
  <div class="tutorial-toolbar">
    <div class="os-picker">
      <span id="os-label">选择你的系统</span>
      <div class="os-buttons" role="group" aria-labelledby="os-label">
        <button id="os-windows" data-os="windows" aria-pressed="true">
          <span data-icon="windows"></span>Windows</button
        ><button id="os-mac" data-os="mac" aria-pressed="false">
          <span data-icon="apple"></span>Mac
        </button>
      </div>
    </div>
    <div class="tutorial-progress">
      <div class="progress-copy"><span>已完成</span><b id="progress-count">0 / 6</b></div>
      <div
        id="progress"
        class="progress"
        role="progressbar"
        aria-label="教程完成进度"
        aria-valuemin="0"
        aria-valuemax="6"
        aria-valuenow="0"
      >
        <span id="progress-fill"></span>
      </div>
    </div>
  </div>
  <nav id="step-nav" aria-label="安装步骤"></nav>
  <div class="guide-topline">
    <div><span class="status-line"></span><span id="guide-position">步骤 01 / 06</span></div>
    <span id="os-hint">Windows 桌面版</span>
  </div>
  <article id="guide" class="guide-card" tabindex="-1" aria-labelledby="step-title"></article>
  <div class="step-actions">
    <button class="previous" id="previous"><span aria-hidden="true">←</span> 上一步</button
    ><span id="action-hint">完成当前操作后，继续下一步</span
    ><button class="next" id="next">已完成，下一步 →</button>
  </div>
  <section class="help" aria-labelledby="help-title">
    <div class="help-heading">
      <h2 id="help-title">卡在这一步？</h2>
      <span>展开问题，看看解决方法。</span>
    </div>
    <div id="faq-list" class="faq-grid"></div>
  </section>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>
</div>
