services:
  web:
    build: .
    restart: unless-stopped
    ports:
      - "${PORT:-3000}:3000"
    environment:
      PORT: "3000"
      DATA_DIR: /app/data
      PUBLIC_ORIGIN: "${PUBLIC_ORIGIN:-}"
      ADMIN_USER: "${ADMIN_USER:-admin}"
      ADMIN_PASSWORD: "${ADMIN_PASSWORD:-}"
    volumes:
      - research-data:/app/data

volumes:
  research-data:
